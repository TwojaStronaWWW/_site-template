name: Deploy STAGING

on:
  push:
    branches:
      - staging

concurrency:
  group: staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy via SFTP
        if: vars.STAGING_PATH != '' && secrets.FTP_SERVER != ''
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          source: './*'
          target: '/home/platne/serwer417204/public_html/${{ vars.STAGING_PATH }}/'
          overwrite: true

      - name: Informacja o pominięciu wdrożenia
        if: vars.STAGING_PATH == '' || secrets.FTP_SERVER == ''
        run: echo "Pomijanie wdrożenia SFTP - brak zdefiniowanych STAGING_PATH lub FTP_SERVER."
