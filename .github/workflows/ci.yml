name: CI & Quality Gate

on:
  push:
    branches:
      - staging
      - main
  pull_request:
    branches:
      - staging
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: 1. Quality Gate & Testy Jednostkowe
    runs-on: ubuntu-latest

    steps:
      - name: 1.1 Pobranie kodu repozytorium
        uses: actions/checkout@v4

      # 1️⃣ Sprawdź czy istnieje index.html lub index.php
      - name: 1.2 Sprawdzenie pliku wejściowego (index.html lub index.php)
        run: |
          if [ ! -f index.html ] && [ ! -f index.php ]; then
            echo "❌ Brak pliku wejściowego index.html lub index.php!"
            exit 1
          fi

      # 2️⃣ Sprawdź czy nie commitujesz sekretów
      - name: 1.3 Ochrona przed wyciekiem sekretów (.env, secrets.php, .htpasswd)
        run: |
          if git ls-files | grep -E "(\.env|config/secrets\.php|\.htpasswd)$"; then
            echo "❌ Wykryto plik z wrażliwymi danymi w repozytorium!"
            exit 1
          fi

      # 3️⃣ Walidacja składni PHP (jeśli występują pliki PHP)
      - name: 1.4 Walidacja składni PHP
        run: |
          if find . -type f -name "*.php" | grep -q .; then
            echo "Sprawdzanie składni PHP..."
            find . -type f -name "*.php" -print0 | xargs -0 -n1 php -l
          else
            echo "Brak plików PHP, pomijanie walidacji PHP."
          fi

      # 4️⃣ Konfiguracja Node.js
      - name: 1.5 Konfiguracja środowiska Node.js
        if: hashFiles('package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 5️⃣ Weryfikacja składni JavaScript
      - name: 1.6 Weryfikacja składni JavaScript
        if: hashFiles('package.json') != ''
        run: npm run check:syntax

      # 6️⃣ Testy jednostkowe z raportem pokrycia
      - name: 1.7 Uruchomienie testów jednostkowych (node:test)
        if: hashFiles('package.json') != ''
        run: npm test -- --experimental-test-coverage

  lighthouse:
    name: 2. Audyt Lighthouse CI (a11y, SEO, Best Practices)
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: 2.1 Pobranie kodu repozytorium
        uses: actions/checkout@v4

      - name: 2.2 Konfiguracja środowiska Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 2.3 Audyt jakościowy Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          uploadArtifacts: true
          temporaryPublicStorage: true
          configPath: './.lighthouserc.json'
