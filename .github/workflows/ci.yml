name: CI

on:
  push:
    branches:
      - staging
      - main
  pull_request:
    branches:
      - staging
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: 1. Quality Gate & Testy Jednostkowe
    runs-on: ubuntu-latest

    steps:
      - name: 1.1 Pobranie kodu repozytorium
        uses: actions/checkout@v4

      # 1️⃣ Sprawdź czy istnieje index.html lub index.php
      - name: 1.2 Sprawdzenie pliku wejściowego (index.html lub index.php)
        run: |
          if [ ! -f index.html ] && [ ! -f index.php ]; then
            echo "Brak pliku index.html lub index.php!"
            exit 1
          fi

      # 2️⃣ Sprawdź czy nie commitujesz .env
      - name: 1.3 Ochrona przed wyciekiem .env
        run: |
          if git ls-files | grep -E "\.env$"; then
            echo "Wykryto plik .env w repozytorium!"
            exit 1
          fi

      # 3️⃣ Walidacja składni PHP (jeśli występują pliki PHP)
      - name: 1.4 Walidacja składni PHP
        run: |
          if find . -type f -name "*.php" | grep -q .; then
            echo "Sprawdzanie składni PHP..."
            find . -type f -name "*.php" -print0 | xargs -0 -n1 php -l
          else
            echo "Brak plików PHP, pomijanie walidacji PHP."
          fi

      # 4️⃣ Konfiguracja Node.js i testy jednostkowe
      - name: 1.5 Konfiguracja środowiska Node.js
        if: hashFiles('package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 1.6 Uruchomienie testów jednostkowych (node:test)
        if: hashFiles('package.json') != ''
        run: npm test -- --experimental-test-coverage

      - name: 1.7 CI Quality Gate Passed
        run: echo "Wszystkie testy i reguły walidacji zakończone sukcesem."
