name: Deploy PRODUCTION

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    name: 🧪 Run Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v7

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 🛡️ Full Quality Gate
        run: npm run check

  deploy:
    name: 🌐 Deploy via SFTP
    needs: ci
    runs-on: ubuntu-latest
    if: vars.PRODUCTION_PATH != ''

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Deploy via SFTP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          source: |
            *
            !.*
            !.git*
            !tests*
            !scripts*
            !docker-compose.yml
            !eslint.config.mjs
            !package*.json
            !*.md
          target: '/home/platne/serwer417204/public_html/${{ vars.PRODUCTION_PATH }}/'
          overwrite: true

      - name: ⚡ Purge Cloudflare Cache (optional)
        if: env.CF_ZONE != '' && env.CF_TOKEN != ''
        env:
          CF_ZONE: ${{ secrets.CLOUDFLARE_ZONE }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
        run: |
          echo "Purging Cloudflare edge cache..."
          curl -s -X POST "https://api.cloudflare.com/client/v4/zones/$CF_ZONE/purge_cache" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'

      - name: Configure Git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Create production release tag
        run: |
          VERSION="v$(date +'%Y.%m.%d')-$(git rev-parse --short HEAD)"
          echo "Creating tag $VERSION"

          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "Tag already exists. Skipping."
          else
            git tag "$VERSION"
            git push origin "$VERSION"
          fi
